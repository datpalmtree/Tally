<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Board: the dotted desk, then the zoomable world (links + notes), then the drag layer -->
<div id="desk" aria-label="Board"></div>
<div id="world" aria-label="Notes"><svg id="links" aria-hidden="true"></svg></div>
<div id="dragLayer"></div>
<div id="marquee" hidden></div>

<!-- Top bar -->
<header id="bar">
  <div class="pill logo"><b>TALLY</b><span>notes that calculate</span></div>
  <div class="pill" role="toolbar" aria-label="Board tools">
    <button class="bb" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4L2 7l3 3"/><path d="M2 7h7.5a4 4 0 010 8H7"/></svg><span class="lbl">Undo</span></button>
    <button class="bb" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l3 3-3 3"/><path d="M14 7H6.5a4 4 0 000 8H9"/></svg><span class="lbl">Redo</span></button>
    <button class="bb" id="bTidy" title="Arrange notes in columns"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg><span class="lbl">Tidy</span></button>
    <button class="bb" id="bLinks" title="Show equation links between notes"><i></i><svg class="only-float" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 9.5l3-3"/><path d="M7 4.5l1.2-1.2a2.6 2.6 0 013.7 3.7L10.7 8.2M5.3 7.8L4.1 9a2.6 2.6 0 003.7 3.7L9 11.5"/></svg><span class="lbl">Links</span></button>
    <button class="bb" id="bClear" title="Remove every note"><svg class="only-float" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg><span class="lbl">Clear desk</span></button>
  </div>
  <div class="pill" role="toolbar" aria-label="Add">
    <button class="bb" id="bText" title="New text note (or double-click the desk)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span class="lbl">Note</span></button>
    <button class="bb" id="bNode" title="New function node — selected notes become its inputs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11.5" cy="8" r="2.5"/><path d="M2 3.5h3.5L9 8M2 8h7M2 12.5h3.5L9 8"/></svg><span class="lbl">Node</span></button>
    <button class="bb" id="bEx" title="Ready-made logic maps to explore"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8a4.2 4.2 0 00-2.4 7.6c.5.4.8 1 .8 1.6v.5h3.2V11c0-.6.3-1.2.8-1.6A4.2 4.2 0 008 1.8z"/><path d="M6.4 13.6h3.2"/></svg><span class="lbl">Examples</span></button>
    <button class="bb" id="bFile" title="Import and export boards"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L12.5 4.5V14.5H4z"/><path d="M9.5 1.5v3h3"/></svg><span class="lbl">Board</span></button>
  </div>
  <div class="pill zoom" role="toolbar" aria-label="Zoom">
    <button class="bb sq" id="zOut" title="Zoom out (Ctrl −)" aria-label="Zoom out">−</button>
    <button class="bb pct" id="zoomPct" title="Back to 100% (Ctrl 0)">100%</button>
    <button class="bb sq" id="zIn" title="Zoom in (Ctrl +)" aria-label="Zoom in">+</button>
    <button class="bb" id="zFit" title="Fit all notes (Ctrl 1)"><span class="lbl">Fit</span><svg class="only-narrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>
  <div class="pill" id="modePill" hidden><button class="bb" id="bMode"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.5" y="4.5" width="9" height="7" rx="1.5"/><path d="M5.5 4.5V3a1.5 1.5 0 011.5-1.5h6A1.5 1.5 0 0114.5 3v5A1.5 1.5 0 0113 9.5h-2.5" stroke-dasharray="2 1.6"/></svg><span class="lbl">Float</span></button></div>
</header>

<!-- The calculator -->
<section class="device" id="calc" data-mode="std" data-orient="portrait" aria-label="Calculator">
  <i class="screw tl" style="--r:24deg"></i><i class="screw tr" style="--r:-12deg"></i><i class="screw bl" style="--r:61deg"></i><i class="screw br" style="--r:5deg"></i>
  <i class="wgrip" id="wgrip" title="Drag to stretch the width · double-click to reset"></i>
  <div class="dev-head">
    <div class="brand"><b><span class="led" id="led"></span>TALLY</b><span>TX‑6 · field calculator</span></div>
    <div class="grille" aria-hidden="true"></div>
    <div class="knob" id="knob" role="slider" tabindex="0" aria-label="Decimal places" aria-valuemin="-1" aria-valuemax="10" aria-valuenow="-1" title="Decimal places — drag or scroll">
      <div class="ring"></div><div class="cap"></div><span class="kl" id="knobLabel">DP · AUTO</span>
    </div>
  </div>
  <div class="dev-fn">
    <div class="switch" id="modeSwitch" role="radiogroup" aria-label="Mode">
      <span class="thumb"></span>
      <button role="radio" data-mode="std" aria-checked="true">STD</button>
      <button role="radio" data-mode="sci" aria-checked="false">SCI</button>
      <button role="radio" data-mode="prg" aria-checked="false">PRG</button>
    </div>
    <div class="fkeys">
      <button class="fk" data-act="tape" title="Tape — history"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 2h8v12l-2-1.2L8 14l-2-1.2L4 14z"/><path d="M6 5.5h4M6 8.5h4"/></svg></button>
      <button class="fk" data-act="scope" title="Scope — graphs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 11c2-6 3.5-6 5 0s3 6 5 0 2.5-5 3-5"/></svg></button>
      <button class="fk" data-act="rotate" title="Rotate — portrait / landscape"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="10" height="7" rx="1.5"/><path d="M5 2.5h5.5a2 2 0 012 2V5"/><path d="M11.2 3.6l1.3 1.4 1.3-1.4"/></svg></button>
      <button class="fk" data-act="cfg" title="Config — look and behaviour"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h6M12 4h1M3 8h2M8 8h5M3 12h7M13 12h0"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="6.5" cy="8" r="1.5"/><circle cx="11.5" cy="12" r="1.5"/></svg></button>
    </div>
  </div>
  <div class="screen" id="screen" aria-live="polite">
    <div class="scr-top" id="scrTop"></div>
    <div class="scr-expr" id="expr"></div>
    <div class="scr-res" id="res">0</div>
    <div class="scr-prg" id="prg"></div>
  </div>
  <div class="mem" id="mem" aria-label="Memory">
    <button data-act="left" title="Move cursor left (←)" aria-label="Cursor left">◂</button><button data-act="mc" title="Memory clear">MC</button><button data-act="mr" title="Memory recall">MR</button><button data-act="m+" title="Add to memory">M+</button><button data-act="m-" title="Subtract from memory">M−</button><button data-act="ms" title="Memory store">MS</button><button data-act="right" title="Move cursor right (→) — at the end it steps out of a bracket" aria-label="Cursor right">▸</button>
  </div>
  <div class="pad pad-mode pad-sci" id="padSci" aria-label="Scientific keys"></div>
  <div class="pad pad-mode pad-prg" id="padPrg" aria-label="Programmer keys"></div>
  <div class="pad pad-std" id="padStd" aria-label="Keys"></div>
  <div class="dev-foot"><span id="footHint">Drop notes on the screen</span><i class="grip" id="grip" title="Drag to resize"></i></div>
</section>

<!-- History tape -->
<aside id="tape" hidden aria-label="Tape">
  <div class="tape-h"><span>Tape</span><span id="tapeCount"></span><span class="sp"></span><button id="tapeClear">Clear</button><button id="tapeClose" aria-label="Close tape">✕</button></div>
  <div class="tape-l" id="tapeList"></div>
</aside>

<!-- Scope -->
<section class="panel" id="scope" hidden aria-label="Scope">
  <div class="ph" data-drag="scope"><i class="screw" style="--r:30deg"></i><h2>Scope</h2><span class="sub" id="scopeSub"></span><span class="sp"></span>
    <button class="tb" id="scLive" title="Include what you're typing">Live</button>
    <button class="tb" id="scFit" title="Fit everything (double-click the graph)">Fit</button>
    <button class="tb" id="scIn" title="Zoom in">+</button>
    <button class="tb" id="scOut" title="Zoom out">−</button>
    <button class="tb" id="scClose" aria-label="Close scope">✕</button>
  </div>
  <div class="srow"><div class="seg" id="scopeModes" role="group" aria-label="View">
    <button data-smode="steps" title="Each equation as climbing steps; x-equations as curves">Steps</button>
    <button data-smode="compare" title="Plotted values side by side">Compare</button>
    <button data-smode="flow" title="How values flow through your links and nodes">Flow</button>
    <button data-smode="tree" title="How one answer is built">Tree</button>
    <button data-smode="sweep" title="Vary one number and watch everything that depends on it">Sweep</button>
  </div></div>
  <div class="srow ctl" id="scopeCtl"></div>
  <div class="cv-wrap"><canvas id="cv"></canvas><div class="empty" id="scopeEmpty"></div><div class="readout" id="readout" hidden></div></div>
  <i class="pgrip" data-grip="scope"></i>
</section>

<!-- Config -->
<section class="panel" id="cfg" hidden aria-label="Config">
  <div class="ph" data-drag="cfg"><i class="screw" style="--r:-20deg"></i><h2>Config</h2><span class="sp"></span><button class="tb" id="cfgClose" aria-label="Close config">✕</button></div>
  <div class="cfg-body" id="cfgBody"></div>
</section>

<div id="stats" hidden></div>
<div id="trash"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>Drop to delete</div>
<div id="pop" class="pop" hidden></div>
<div id="linktip" class="linktip" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="script.js"></script>
</body>
</html>
